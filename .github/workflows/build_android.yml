name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create Clean Project and Build
        run: |
          # إذا كان مجلد flutter_mobile_app غير موجود أو ناقص، سنقوم بإنشائه كمرجع أساسي
          if [ ! -d "flutter_mobile_app" ]; then
            flutter create flutter_mobile_app --org com.sym.app --project-name sym_app --platforms android
          fi
          
          cd flutter_mobile_app
          
          # جلب الحزم وبناء ملف الـ APK بنجاح
          flutter pub get
          flutter build apk --release
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_mobile_app/build/app/outputs/flutter-apk/app-release.apk
