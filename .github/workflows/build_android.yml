name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Locate and Build Flutter Project
        run: |
          # البحث التلقائي عن المجلد الذي يحتوي على ملف pubspec.yaml
          PROJECT_PATH=$(find . -name "pubspec.yaml" -maxdepth 3 | xargs dirname)
          echo "Found Flutter project at: $PROJECT_PATH"
          
          cd "$PROJECT_PATH"
          flutter pub get
          flutter build apk --release
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
