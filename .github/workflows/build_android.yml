name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build APK with Auto-Target
        run: |
          cd flutter_mobile_app
          flutter pub get
          
          # البحث عن ملف main.dart الحقيقي وبنائه مباشرة
          MAIN_PATH=$(find . -name "main.dart" -path "*/lib/*" | head -n 1)
          echo "Building target: $MAIN_PATH"
          
          flutter build apk --release -t "$MAIN_PATH"
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_mobile_app/build/app/outputs/flutter-apk/app-release.apk
