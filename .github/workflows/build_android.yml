name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Find and Build Flutter Project
        run: |
          echo "Finding pubspec.yaml..."
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Project directory: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          flutter pub get
          
          if [ -f "lib/main.dart" ]; then
            echo "Found lib/main.dart directly."
            flutter build apk --release
          else
            MAIN_FILE=$(find . -name "main.dart" | head -n 1)
            echo "Found main.dart at: $MAIN_FILE"
            flutter build apk --release -t "$MAIN_FILE"
          fi
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
