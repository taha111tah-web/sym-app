name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Force Clean Build Setup
        run: |
          # التحقق من وجود مجلد المشروع أو إنشائه بالشكل الصحيح إذا كان مفقوداً
          if [ ! -d "flutter_mobile_app" ] || [ ! -f "flutter_mobile_app/pubspec.yaml" ]; then
            echo "Creating fresh Flutter project structure..."
            mkdir -p flutter_mobile_app
            cd flutter_mobile_app
            flutter create . --org com.sym.app --project-name sym_app --platforms android
          else
            cd flutter_mobile_app
          fi
          
          echo "Running pub get..."
          flutter pub get
          
          echo "Building APK release..."
          flutter build apk --release
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_mobile_app/build/app/outputs/flutter-apk/app-release.apk
