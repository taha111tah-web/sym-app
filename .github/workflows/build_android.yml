name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Diagnostic and Build
        run: |
          echo "=== 1. فحص محتويات المستودع الرئيسي ==="
          ls -la
          
          echo "=== 2. البحث عن مكان ملف الإعدادات pubspec.yaml ==="
          find . -name "pubspec.yaml"
          
          echo "=== 3. البحث عن مكان ملف التشغيل main.dart ==="
          find . -name "main.dart"
          
          echo "=== 4. الانتقال تلقائياً وبدء البناء ==="
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          echo "المجلد المحدد للبناء هو: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
