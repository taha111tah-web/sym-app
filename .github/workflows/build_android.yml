name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Locate and Build Flutter Project
        run: |
          echo "Searching for pubspec.yaml..."
          PROJECT_PATH=$(find . -name "pubspec.yaml" -maxdepth 3 | xargs dirname)
          echo "Found Flutter project at: $PROJECT_PATH"
          
          cd "$PROJECT_PATH"
          flutter pub get
          
          # البحث التلقائي عن ملف التشغيل الرئيسي أينما وجد
          MAIN_FILE=$(find . -name "main.dart" | head -n 1)
          echo "Found main file at: $MAIN_FILE"
          
          flutter build apk --release -t "$MAIN_FILE"
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
