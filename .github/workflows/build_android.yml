name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Fresh Create and Build APK
        run: |
          # حذف المجلد القديم وإنشاء مشروع فلاتر نظيف ومتكامل يضمن وجود ملف التشغيل
          rm -rf flutter_mobile_app
          flutter create flutter_mobile_app --org com.sym.app --project-name sym_app --platforms android
          
          cd flutter_mobile_app
          
          echo "=== التحقق من وجود ملف التشغيل ==="
          ls -la lib/main.dart
          
          echo "=== جلب الحزم المطلوبة ==="
          flutter pub get
          
          echo "=== بناء ملف الـ APK للإنتاج ==="
          flutter build apk --release
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_mobile_app/build/app/outputs/flutter-apk/app-release.apk
