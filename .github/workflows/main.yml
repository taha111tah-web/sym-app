name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Auto Find and Build
        run: |
          echo "=== البحث الشامل عن ملفات المشروع ==="
          PUB_PATH=$(find . -name "pubspec.yaml" | head -n 1)
          MAIN_PATH=$(find . -name "main.dart" | head -n 1)
          
          if [ -z "$PUB_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          }
          
          if [ -z "$MAIN_PATH" ]; then
            echo "Error: main.dart not found!"
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$PUB_PATH")
          # استخدام المسار المطلق لملف التشغيل لضمان عدم ضياعه نهائياً
          ABS_MAIN_PATH=$(realpath "$MAIN_PATH")
          
          echo "Found project at: $PROJ_DIR"
          echo "Target main file absolute path: $ABS_MAIN_PATH"
          
          cd "$PROJ_DIR"
          flutter pub get
          
          echo "Building APK..."
          flutter build apk --release -t "$ABS_MAIN_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sym-app-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
